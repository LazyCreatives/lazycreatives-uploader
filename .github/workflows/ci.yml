name: tests
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable + dev extras)
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    env:
      # The renderer tests and vite build don't need the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Run tests
        run: npm test
      - name: Build renderer
        run: npm run build

  # A pull request that changes the app's version must bring that version's
  # "What's new" notes in CHANGELOG.md; the release copies them onto its page.
  release-notes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Notes for a new version
        env:
          BASE: ${{ github.base_ref }}
        run: |
          new=$(node -p "require('./electron/package.json').version")
          old=$(git show "origin/$BASE:electron/package.json" | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          if [ "$new" = "$old" ]; then echo "Version unchanged ($new)."; exit 0; fi
          python3 .github/scripts/release_notes.py "$new" --check
